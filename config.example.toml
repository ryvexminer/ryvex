# --- Zano solo mining through the official local daemon ---
# Wait until the daemon is fully synchronized, then enable its loopback Stratum server:
# zanod --stratum --stratum-miner-address=YOUR_ZANO_WALLET_HERE --stratum-bind-ip=127.0.0.1 --stratum-bind-port=11555
# Ryvex automatically sends the wallet and worker in the daemon's separate login fields.
# [[pools]]
# url = "stratum+tcp://127.0.0.1:11555"
# wallet = "YOUR_ZANO_WALLET_HERE"
# password = "x"
# tls = false
# is_backup = false
# coin = "ZANO"

# --- Firo (FiroPoW) - replacement pool example ---
# FIRO uses a separate FiroPoW coin profile and dev-fee route from KIIRO.
# Live FIRO accepted-share validation is still pending; use this profile for controlled FIRO pool validation.
# [[pools]]
# url = "stratum+tcp://pool.woolypooly.com:3104"
# wallet = "YOUR_FIRO_WALLET_HERE"
# password = "x"
# tls = false
# is_backup = false
# coin = "FIRO"

# --- Kiirocoin (FiroPoW) - replacement pool examples ---
# KIIRO uses FiroPoW, but it is a separate coin profile from FIRO.
# Rplant SSL has short accepted-share validation; longer pool-side runs are still recommended.
# [[pools]]
# url = "stratum+ssl://stratum-eu.rplant.xyz:17098"
# wallet = "YOUR_KIIRO_WALLET_HERE"
# password = "x"
# tls = true
# is_backup = false
# coin = "KIIRO"

# [[pools]]
# url = "stratum+tcp://stratum-eu.rplant.xyz:7098"
# wallet = "YOUR_KIIRO_WALLET_HERE"
# password = "x"
# tls = false
# is_backup = true
# coin = "KIIRO"

# === GPU Configuration ===
[gpu]
# GPU indices to use (empty = all detected GPUs)
# Example: [0, 1] to use the first 2 GPUs
# Each GPU launches an independent worker connected to the pool
devices = []

# Mining intensity (0.0 to 1.0)
# 1.0 = full power, 0.5 = half power (reduces temperature)
intensity = 1.0

# Thermal protection: pause mining when GPU reaches temp_stop (°C)
# Mining resumes when temperature drops to temp_start (°C)
# 0 = disabled (default: built-in 85/75°C safety limit still active)
# temp_stop = 80
# temp_start = 70

# Hashrate watchdog: restart GPU worker if 5-min average drops below this (H/s)
# Useful to detect stuck GPUs or driver crashes. 0 = disabled.
# Example: 20000000 = 20 MH/s
# min_hashrate = 0

# === Logging ===
[logging]
# Log level: "trace", "debug", "info", "warn", "error"
level = "info"

# Write logs to a file (optional, uncomment to enable)
# file = "ryvex.log"

# === Web Dashboard ===
[dashboard]
# Enable web dashboard (accessible via browser at http://localhost:8081)
enabled = true

# Dashboard port (0 to disable)
port = 8081

# API key required to enable dashboard control actions (optional).
# Without it, dashboard controls are read-only. The browser prompts for this
# value per session and sends it only in the X-API-Key request header.
# api_key = "a-random-secret-key"

# HTTP API bind address (default: "127.0.0.1" = local only)
# Set to "0.0.0.0" to listen on all interfaces (multi-rig LAN monitoring)
# bind_address = "0.0.0.0"

# Static HTTP API token for remote access (optional).
# If empty or absent, a random token is generated each session.
# API requests must include Authorization: Bearer TOKEN or X-API-Key: TOKEN.
# A static token allows remote GUIs to reconnect after a reboot.
# Generate a token: openssl rand -hex 32
# api_token = "your-secret-token-here"

# Optional read-only summaries for explicitly configured remote rigs. The
# embedded dashboard fetches these URLs server-side with a short timeout; the
# browser never receives their URLs or tokens. Remote rigs cannot control this
# miner, and no remote targets are contacted unless an entry is enabled.
# [[dashboard.multi_rig]]
# name = "garage-rig"
# summary_url = "http://192.168.1.42:8080/api/stats"
# api_token = "remote-rig-read-token"

# === Network Timeouts ===
[timeouts]
# Pool connection timeout in seconds (default: 10)
pool_connect_secs = 10
# Pool message receive timeout in seconds (default: 2)
pool_recv_secs = 2

# === Multi-pool Failover ===
[failover]
# When the miner is on a backup pool, check interval for the primary
# pool in seconds (default: 60). If the primary comes back,
# the miner switches automatically.
primary_check_interval_secs = 60
# If the pool sends no messages during this delay (in seconds),
# it is considered silent and the miner triggers a failover.
# Active pools send mining.notify every ~15-30s.
silence_timeout_secs = 90

# === Mining ===
[mining]
# Verify GPU shares on CPU before submitting (avoids invalid shares)
cpu_check = true
# Electricity cost per kWh (for profit display in stats and summary)
electricity_cost = 0.15
# Currency symbol for electricity cost display
# Examples: "USD", "GBP", "JPY", "CNY", "CAD", "AUD"
electricity_currency = "USD"

# DAG cache: keep old DAG while generating new one ("auto", "true", "false")
# Auto enables on GPUs with 12GB+ VRAM
dag_cache = "auto"
# Save reusable DAGs during clean shutdown for fast reload on next startup.
# Retention is bounded to one current file per supported algorithm; the current
# FiroPoW terminal DAG uses about 6.7 GiB. Use --flush-dag to remove all files.
# Location: %LOCALAPPDATA%/ryvex/dag-cache/ (Windows) or ~/.local/share/ryvex/dag-cache/ (Linux)
dag_cache_save = true
# Benchmark duration in seconds (used with --benchmark flag)
benchmark_duration_secs = 60

# Optional active autotune profile snapshot.
# Disabled by default. Autotune profiles adjust Ryvex kernel launch settings only;
# they never change GPU clocks, fan speed, voltage, or power limit.
# [mining.applied_autotune_profile]
# enabled = false
# name = ""

# === Advanced Tuning (optional) ===
# Most users should leave defaults.
# Optional KawPoW autotune is disabled unless explicitly enabled.
# You can also run a one-off report with:
#   ryvex --benchmark -a kawpow --autotune --benchmark-json autotune.json
# Then save and apply the selected software launch profile with:
#   ryvex --autotune-profile-create rtx3070-efficient --from-benchmark autotune.json
#   ryvex --config config.toml --autotune-profile rtx3070-efficient
# [mining.tuning]
# kawpow_burst = 1            # CUDA kernels queued before sync (1-4, higher = more throughput, >2 risks TDR on Windows)
# kawpow_grid_mult = 12       # Grid multiplier for CUDA launches (default 12, clamped to 12)
# progpowz_grid_mult = 12     # Grid multiplier for ProgPowZ CUDA launches (default 12, internal tuning)
# fishhash_grid_mult = 16     # FishHash queued-grid multiplier (default 16). Test a lower value, such as 4, only with a measured efficiency comparison.
# kawpow_autotune = false     # Enable KawPoW grid autotune in benchmark mode
# kawpow_autotune_grid_min = 6   # Lowest grid multiplier to benchmark during autotune
# kawpow_autotune_grid_max = 12  # Highest grid multiplier to benchmark during autotune
# kawpow_autotune_duration_secs = 30       # Seconds per autotune benchmark candidate
# nvrtc_max_registers = 0     # Per-thread register cap for KawPoW NVRTC kernels (0 = compiler default; lower values can spill)
# kawpow_precompile = true    # Pre-compile next ProgPoW period kernel in background (eliminates 10-15s stall)
# kawpow_cpu_verify = "adaptive"  # CPU share verification: "adaptive" (default), "always", "off"
# dag_verify = false          # Heavy DAG integrity check after generation (~60s, for diagnosing VRAM corruption under OC)
#
# target_multiplier = 1.0     # Scales the local share target sent to the pool (default: 1.0, auto-adjusts on reject).
#                             # Increase when the pool's baseline difficulty is much higher than the binary's default
#                             # assumption — avoids 2-3 rejected shares at session start while the auto-ladder catches up.
#                             # Recommended values by pool category:
#                             #   1.0  — most pools (NiceHash, HeroMiners, WoolyPooly, Nanopool)
#                             #   4.0  — 2miners ERG (Autolykos2) high-diff sessions
#                             #   8.0  — ultra-high-diff sessions (rare)

# === Profit Autopilot ===
# "dry_run" records conservative decisions but never changes the active pool.
# "auto" is opt-in and only acts when a configured candidate passes every safety gate.
[profit_autopilot]
mode = "dry_run"
# Minimum time on the current selection before a new decision can be actionable.
min_dwell_secs = 900
# Do not act on prices older than this value.
max_price_age_secs = 300
# Conservative transition-cost estimates used by the policy.
dag_prepare_secs = 120
restart_downtime_secs = 30
no_share_secs = 300
